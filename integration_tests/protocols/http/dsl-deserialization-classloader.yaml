id: test-dsl-deseriialization-classloader

info:
  name: RAW Template with DSL Deserialization classloader
  author: gongjl
  severity: info
variables:
  base64Class: 

http:
  - raw:
      # Note for the integration test: dsl expression should not contain commas
      - |
        POST /deserialize HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        gadget: CommonsBeanutils1_183 classloader

        data={{generate_java_gadget_classloader("CommonsBeanutils1_183", "{{base64Class}}", "base64")}}
